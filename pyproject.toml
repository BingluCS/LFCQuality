[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lfcquality"
version = "0.2.0"
description = "Independent, OpenMP-accelerated quality analysis for scientific floating-point fields"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10", "scikit-image>=0.22"]

[project.scripts]
lfcquality = "lfcquality.cli:main"

[project.entry-points."lfcbenchmark.metrics"]
lfcquality = "lfcquality.integration:quality_metric"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lfcquality = ["native/*.cpp", "native/*.h", "native/lfcquality/*.h", "native/lfcquality/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
